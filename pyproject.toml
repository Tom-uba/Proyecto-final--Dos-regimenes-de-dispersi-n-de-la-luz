[project]
name = "dos-regimenes"
version = "0.1.0"
description = "Dos regímenes de reflectancia en acetato de celulosa poroso — proyecto final"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "scikit-image>=0.22",
    "miepython>=2.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dosregimenes"]

[tool.uv]
package = true
